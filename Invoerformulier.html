<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./styling/Algemeen.css" />
    <link rel="stylesheet" href="./styling/Navbar.css" />
    <link rel="stylesheet" href="./styling/Invoerformulier.css" />
  </head>
  <body>
    <div id="navbar"></div>
<div class="form">
    <h1>Invoerformulier</h1>
    <form id="contact-form" novalidate>
      <label for="naam">
        <p>Naam:</p>
      </label>
      <input
        type="text"
        id="naam"
        name="naam"
        required
        aria-describedby="naam-fout"
        aria-invalid="false"
      /><br />
      <p id="naam-fout" class="fout" hidden></p>
      <br /><br />

      <label for="email">
        <p>Email:</p>
      </label>
      <input
        type="email"
        id="email"
        name="email"
        required
        aria-describedby="email-fout"
        aria-invalid="false"
      /><br />
      <p id="email-fout" class="fout" hidden></p>
      <br /><br />

      <label for="bericht">
        <p>Bericht:</p>
      </label>
      <textarea
        id="bericht"
        name="bericht"
        required
        aria-describedby="bericht-fout"
        aria-invalid="false"
      ></textarea
      ><br />
      <p id="bericht-fout" class="fout" hidden></p>
      <br /><br />

      <button type="submit">Verzenden</button>
    </form>
</div>
    <p id="form-status" role="status"></p>
    <script src="./Scripts/LoadNavbar.js"></script>
    <script src="./Scripts/Invoerformulier.js"></script>
  </body>
</html>
