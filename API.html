<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styling/Algemeen.css">
    <link rel="stylesheet" href="./styling/Navbar.css">
</head>
<body>
<h1 id="navbar"></h1>
<script src="./Scripts/LoadNavbar.js"></script>
<script src="./Scripts/RestfullAPI.js"></script>
<h1>Producten beheren</h1>

<form id="productForm">
    <h1 id="formTitel">Nieuw product</h1>

    <label for="naam">Naam</label>
    <input type="text" id="naam" required minlength="2">

    <label for="generatie">Generatie</label>
    <input type="text" id="generatie">

    <label for="prijs">Prijs in euro's</label>
    <input type="number" id="prijs" min="0" step="0.01">

    <label for="capaciteit">Capaciteit</label>
    <input type="text" id="capaciteit">

    <button type="submit" id="opslaanKnop">Toevoegen</button>
    <button type="button" id="annuleerKnop" hidden>Annuleren</button>
</form>

<p id="status" role="status"></p>
<div id="productenLijst"></div>

<script src="./Scripts/APIUitlezen.js"></script>

</body>
</html>
